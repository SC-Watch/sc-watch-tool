# Build the standalone folder, zip it, and publish it as a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# That is the whole release procedure. The runner builds it, so nobody needs
# PyInstaller on their own machine, and the artefact people download is built
# from a tagged commit rather than from whatever was on somebody's disk that
# afternoon.
#
# ONE ARTEFACT, on purpose. There used to be an installer as well, built here
# because the runner ships with Inno Setup. It and the zip were the same
# PyInstaller folder; the installer only copied it under %LOCALAPPDATA% and
# added shortcuts. Testers wanted the folder - one place they can find, zip
# and send back - so the installer went, and the zip is portable by default:
# build.py writes portable.txt into the folder, which puts the database,
# settings and screenshots in data\ beside the executables.

name: release

on:
  push:
    tags: ["v*"]
  # Buildable by hand from the Actions tab, producing artefacts but no
  # release. Useful for checking a build before committing to a tag.
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Action majors are current on purpose. The v4/v5 generation runs on
      # Node 20, which GitHub has deprecated on its runners; every step
      # using one emits a warning now and stops working later.

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The version every measurement in the engineering log was taken on.
          python-version: "3.13"
          cache: pip

      - name: Check the tag matches VERSION
        # A release labelled v0.2.0 that installs as 0.1.0 is the kind of thing
        # nobody notices until someone reports a bug against the wrong build.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag  VERSION=$file"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match VERSION ($file)"
            exit 1
          fi

      - name: Build the folder and the zip
        shell: bash
        run: python build.py

      - name: Smoke-test the build
        # Proves the frozen binary starts and can find its own resources.
        # Cheap, and it catches the failure mode PyInstaller is prone to: an
        # exe that builds fine and cannot load its models.
        shell: pwsh
        run: |
          & ".\dist\sc-watch\sc-watch.exe" --where
          if ($LASTEXITCODE -ne 0) { throw "the built exe did not run" }
          # Portable by default is the whole distribution decision, and it is
          # one file doing it. If it is missing, every user's data silently
          # goes to %LOCALAPPDATA% instead and nobody finds out until they
          # try to zip their folder and send it back.
          if (-not (Test-Path ".\dist\sc-watch\portable.txt")) {
              throw "portable.txt is not in the build"
          }
          # The bundled watchlist has to be IN the folder, not just in the
          # source tree: without it a fresh install starts with no list.
          if (-not (Test-Path ".\dist\sc-watch\_internal\starter_list.json")) {
              throw "starter_list.json is not in the build"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: sc-watch-windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true          # you press publish, after checking the assets
          generate_release_notes: true
          files: dist/*.zip
          body: |
            ## Install

            Download the **.zip** below, unpack it anywhere you like, and run
            **sc-watch.bat**. No Python, no installer, no administrator
            prompt.

            Everything stays in that one folder - the program, your database,
            your settings and your screenshots, in `data\`. Move the folder
            and it all moves with it. To keep your data in your user profile
            instead, delete `portable.txt`.

            Windows may warn about an unrecognised publisher, because this
            build is not code-signed. Choose *More info* then *Run anyway*.

            ## Upgrading

            **From 0.1.x:** your data is in `%LOCALAPPDATA%\sc-watch`, not
            beside the program, so the new version starts out empty. Nothing
            is lost. Copy everything in that folder into `data\` in the new
            one (make `data` if it is not there) - the README's *Upgrading*
            section has the steps, and sc-watch says so at the top of the
            page until it is done.

            **From 0.2.0 on:** unpack the new zip and copy your `data\`
            folder across. Nothing else in the folder is yours.

            The README's *New in 0.2.0* lists what changed - including the
            spoken-alert bug that silenced every alert after the first.

            ## Before it will read anything

            Turn **chromatic aberration off** in Star Citizen's graphics
            options. With it on, the coloured fringing on HUD text defeats
            the recogniser.

            `sc-watch.exe --where` prints where your database and settings
            live.
