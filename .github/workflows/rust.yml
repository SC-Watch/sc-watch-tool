# The Rust port: format, lint and test on Windows and Linux, on every push to
# the rust-port branch. Tests that need the real frame corpus skip themselves
# here - those frames name real players and never leave the developer's PC
# (PORT.md). Everything a runner can check without them, it checks.
name: rust

on:
  push:
    branches: [rust-port]
  pull_request:
    branches: [rust-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Linux: a virtual X server for the capture test, and uinput open to
      # the runner (with the event nodes it makes readable) for the
      # keyboard and joystick test. Both tests skip where these are missing.
      - name: Linux test devices
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          sudo modprobe uinput || true
          echo 'KERNEL=="event*", SUBSYSTEM=="input", MODE="0666"' | sudo tee /etc/udev/rules.d/99-scw-ci.rules
          echo 'KERNEL=="uinput", MODE="0666"' | sudo tee -a /etc/udev/rules.d/99-scw-ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod 666 /dev/uinput || true
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" cargo test --workspace 2>&1 | tee test.log
          else
            cargo test --workspace 2>&1 | tee test.log
          fi
      # What the Linux device tests actually did - ran, or skipped and why -
      # as annotations on the run.
      - name: Linux device tests, said
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" cargo test -q -p scw-capture --test x11_xvfb -- --nocapture
          SCW_OVERLAY_X11_TEST=1 xvfb-run -a -s "-screen 0 1280x720x24" cargo test -q -p scw-overlay --test overlay_x11 -- --nocapture
          cargo test -q -p scw-input --test linux_uinput -- --nocapture
      # The Wayland capture against real PipeWire, a headless Wayland
      # desktop and the screen-cast portal (the script says what ran).
      - name: Linux screen-cast tests
        if: runner.os == 'Linux'
        run: bash .github/scripts/linux-screencast.sh
      # The Linux test build: a folder to unpack and run (portable, its data
      # beside it), downloadable from the run's page for 30 days.
      - name: Linux build
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p scw-app -p scw-watch -p scw-ui
          cargo install cargo-about --locked --features cli
          cargo about generate --workspace about.hbs -o dist-licenses.html
          bash packaging/linux/package.sh
          cd dist/sc-watch
          SCW_DATA_ROOT="$RUNNER_TEMP/smoke" ./sc-watch --help >/dev/null
          test -f portable.txt && test -f licenses/third-party.html
          grep -q 'github.com/Niteb1rd/IRIS' licenses/third-party.html
          grep -q 'github.com/PaddlePaddle/PaddleOCR' licenses/third-party.html
          echo "::notice title=linux build::$(du -sh . | cut -f1); needs: $(ldd ./sc-watch | awk '{print $1}' | paste -sd ' ')"
      - name: Linux build, uploaded
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: sc-watch-rust-linux-x86_64
          path: dist/*.tar.gz
          retention-days: 30
          if-no-files-found: error
      # A failing test's first lines, as annotations on the run: they can be
      # read without signing in, which the log cannot. Only committed,
      # made-up fixtures are tested here, so nothing private is in them.
      - name: Why the tests failed
        if: failure()
        shell: bash
        run: |
          awk '
            /^---- .* stdout ----$/ { if (msg != "") print msg; msg = "::error title=" $2 "::"; n = 0; next }
            /^failures:$/ { if (msg != "") print msg; msg = ""; exit }
            msg != "" && n < 20 { gsub(/%/, "%25"); msg = msg $0 "%0A"; n++ }
            END { if (msg != "") print msg }
          ' test.log
