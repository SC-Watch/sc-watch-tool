# The Rust port: format, lint and test on Windows and Linux, on every push to
# the rust-port branch. Tests that need the real frame corpus skip themselves
# here - those frames name real players and never leave the developer's PC
# (PORT.md). Everything a runner can check without them, it checks.
name: rust

on:
  push:
    branches: [rust-port]
  pull_request:
    branches: [rust-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Linux: a virtual X server for the capture test, and uinput open to
      # the runner (with the event nodes it makes readable) for the
      # keyboard and joystick test. Both tests skip where these are missing.
      - name: Linux test devices
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          sudo modprobe uinput || true
          echo 'KERNEL=="event*", SUBSYSTEM=="input", MODE="0666"' | sudo tee /etc/udev/rules.d/99-scw-ci.rules
          echo 'KERNEL=="uinput", MODE="0666"' | sudo tee -a /etc/udev/rules.d/99-scw-ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod 666 /dev/uinput || true
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" cargo test --workspace 2>&1 | tee test.log
          else
            cargo test --workspace 2>&1 | tee test.log
          fi
      # A failing test's first lines, as annotations on the run: they can be
      # read without signing in, which the log cannot. Only committed,
      # made-up fixtures are tested here, so nothing private is in them.
      - name: Why the tests failed
        if: failure()
        shell: bash
        run: |
          awk '
            /^---- .* stdout ----$/ { if (msg != "") print msg; msg = "::error title=" $2 "::"; n = 0; next }
            /^failures:$/ { if (msg != "") print msg; msg = ""; exit }
            msg != "" && n < 20 { gsub(/%/, "%25"); msg = msg $0 "%0A"; n++ }
            END { if (msg != "") print msg }
          ' test.log
