# The Rust port: format, lint and test on Windows and Linux, on every push to
# the rust-port branch. Tests that need the real frame corpus skip themselves
# here - those frames name real players and never leave the developer's PC
# (PORT.md). Everything a runner can check without them, it checks.
name: rust

on:
  push:
    branches: [rust-port]
  pull_request:
    branches: [rust-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log
      # A failing test's first lines, as annotations on the run: they can be
      # read without signing in, which the log cannot. Only committed,
      # made-up fixtures are tested here, so nothing private is in them.
      - name: Why the tests failed
        if: failure()
        shell: bash
        run: |
          awk '
            /^---- .* stdout ----$/ { if (msg != "") print msg; msg = "::error title=" $2 "::"; n = 0; next }
            /^failures:$/ { if (msg != "") print msg; msg = ""; exit }
            msg != "" && n < 20 { gsub(/%/, "%25"); msg = msg $0 "%0A"; n++ }
            END { if (msg != "") print msg }
          ' test.log
