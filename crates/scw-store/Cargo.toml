[package]
name = "scw-store"
description = "sc-watch's stored data: the JSON config files as jsonstore.py keeps them, and the SQLite databases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
regex = "1"
scw-vision = { path = "../scw-vision" }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
getrandom = "0.4.3"

[dev-dependencies]
filetime = "0.2.30"
