[package]
name = "scw-watch"
description = "The sc-watch watcher - watch.py: trigger, burst, announce, settle, look up"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jpeg-encoder = "0.7.1"
png = "0.17"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
scw-input = { path = "../scw-input" }
scw-rsi = { path = "../scw-rsi" }
scw-store = { path = "../scw-store" }
scw-vision = { path = "../scw-vision" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
