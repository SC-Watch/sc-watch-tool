[package]
name = "scw-replay"
description = "Replays saved frames through sc-watch's Rust reading pipeline (IRIS finder and reader, classifier, burst vote)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
scw-vision = { path = "../scw-vision" }
scw-capture = { path = "../scw-capture" }
serde_json = { version = "1", features = ["float_roundtrip"] }
