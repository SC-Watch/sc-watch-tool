[package]
name = "scw-ui"
description = "The sc-watch page - ui_server.py: a tile per contact, served locally"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sc-watch-ui"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3.4.5"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
scw-audio = { path = "../scw-audio" }
scw-input = { path = "../scw-input" }
scw-rsi = { path = "../scw-rsi" }
scw-store = { path = "../scw-store" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
