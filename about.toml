# Settings for cargo-about, which lists the licences of every library the
# builds include (licenses/third-party.html in the download).
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CC0-1.0",
    "Unlicense",
    "GPL-3.0-or-later",
    "CDLA-Permissive-2.0",
    "IJG",
    "0BSD",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
